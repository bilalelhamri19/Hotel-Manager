<!doctype html>
<html lang="en">
  <head>
    <meta property="og:title" content="Hotel Manager Dashboard">
<meta property="og:description" content="Application de gestion hôtelière développée avec React.js, Vite, Supabase et Chart.js.">
<meta property="og:image" content="https://bilhotel.vercel.app/og-hotel.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://bilhotel.vercel.app/">
<meta property="og:type" content="website">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Manager</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log('SW unregistered successfully');
            });
          }
        }).catch(err => {
          console.error('Error unregistering SW:', err);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
